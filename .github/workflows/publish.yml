name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Release tag must match package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$PKG_VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Uses npm trusted publishing: GitHub's OIDC identity (id-token: write
      # above) replaces a long-lived NPM_TOKEN. Configured on npmjs.com under
      # @getparafe/verify > Settings > Trusted Publisher (repo getparafe/verify,
      # workflow publish.yml). --provenance links the package to this build.
      - name: Publish to npm
        run: npm publish --access public --provenance
